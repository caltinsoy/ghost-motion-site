<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0A1A">
<title>Ghost Motion</title>
<meta name="description" content="Ghost Motion, an iOS game of spatial prediction.">
<style>
  :root { --bg:#0A0A1A; --text:#E6E8F2; --dim:#9AA0B8; --accent:#7FD8FF; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; text-align:center;
    font:16px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding:24px; box-sizing:border-box; }
  h1 { font-size:clamp(30px, 9vw, 44px); letter-spacing:.18em; margin:0 0 8px; font-weight:700; }
  p { color:var(--dim); margin:0 0 32px; }
  a { color:var(--accent); text-decoration:none; border:1px solid rgba(127,216,255,.45); padding:12px 22px; border-radius:999px;
    letter-spacing:.14em; font-size:13px; font-weight:700; text-transform:uppercase; }
  a:hover, a:focus { border-color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>GHOST MOTION</h1>
  <p>A spatial prediction game for iPhone.</p>
  <a href="privacy.html">Privacy Policy</a>
</main>
</body>
</html>
